name: Test Memory Wiki

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    env:
      HERMES_HOME: .hermes-ci
      HERMES_SECURITY_STRICT: "0"
      MEMORY_WIKI_SEMANTIC: "0"
      MEMORY_WIKI_DOCUMENT_AUTO_SCAN_CACHE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Verify locked release contract
        run: |
          uv lock --check
          python packaging/verify_release.py
      - name: Run regression suite
        run: uv run --with pytest python -m pytest -q
      - name: Build wheel
        run: uv build --wheel
