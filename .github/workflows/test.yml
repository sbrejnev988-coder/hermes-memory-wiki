name: Test Memory Wiki

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    env:
      HERMES_HOME: .hermes-ci
      HERMES_SECURITY_STRICT: "0"
      MEMORY_WIKI_SEMANTIC: "0"
      MEMORY_WIKI_DOCUMENT_AUTO_SCAN_CACHE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Verify locked release contract
        run: |
          uv lock --check
          python packaging/verify_release.py
      - name: Run regression suite
        run: uv run --with pytest python -m pytest -q
      - name: Build wheel
        run: uv build --wheel
